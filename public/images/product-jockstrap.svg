<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="js-t">
  <title id="js-t">Jockstrap blueprint</title>
  <defs>
    <pattern id="gjs" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.6" fill="#d4d4d4"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="#fafaf5"/>
  <rect width="400" height="400" fill="url(#gjs)"/>

  <!-- yellow waistband -->
  <rect x="80" y="130" width="240" height="28" fill="#ffd400"/>

  <!-- waistband outline -->
  <path d="M 80,130 L 320,130 L 320,158 L 80,158 Z" fill="none" stroke="#171717" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- pouch -->
  <path d="M 170,158 L 230,158 L 222,232 Q 200,250 178,232 Z" fill="none" stroke="#171717" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- left strap -->
  <path d="M 170,158 Q 145,210 110,270 L 95,285" fill="none" stroke="#171717" stroke-width="2.5" stroke-linecap="round"/>

  <!-- right strap -->
  <path d="M 230,158 Q 255,210 290,270 L 305,285" fill="none" stroke="#171717" stroke-width="2.5" stroke-linecap="round"/>

  <!-- pouch center seam -->
  <line x1="200" y1="158" x2="200" y2="245" stroke="#171717" stroke-width="1.2" stroke-dasharray="4 3"/>

  <text x="200" y="350" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2.5" fill="#737373">JOCKSTRAP · 005</text>
</svg>
