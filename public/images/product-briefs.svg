<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="briefs-t">
  <title id="briefs-t">Briefs blueprint</title>
  <defs>
    <pattern id="gb" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.6" fill="#d4d4d4"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="#fafaf5"/>
  <rect width="400" height="400" fill="url(#gb)"/>

  <!-- yellow waistband fill -->
  <rect x="100" y="130" width="200" height="28" fill="#ffd400"/>

  <!-- silhouette outline -->
  <path d="M 100,130 L 300,130 L 300,158 Q 295,205 275,235 Q 255,265 225,272 Q 210,272 205,260 L 200,248 L 195,260 Q 190,272 175,272 Q 145,265 125,235 Q 105,205 100,158 Z"
        fill="none" stroke="#171717" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- waistband edge -->
  <line x1="100" y1="158" x2="300" y2="158" stroke="#171717" stroke-width="1.8"/>
  <!-- center seam -->
  <line x1="200" y1="158" x2="200" y2="248" stroke="#171717" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- label -->
  <text x="200" y="350" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2.5" fill="#737373">BRIEFS · 001</text>
</svg>
